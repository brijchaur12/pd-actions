name: 💥 PD Actions

on:
    schedule:
      - cron: '0 0 * * *'
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Setup golang
        uses: actions/setup-go@v2
        with:
          go-version: 1.15

      - name: Setup Dependencies
        run: sudo apt-get install libpcap-dev # Required for Naabu

      - name: Cache Go
        id: cache-go
        uses: actions/cache@v2
        with:
          path: /home/runner/go
          key: ${{ runner.os }}-go

      - name: Setting up ProjectDiscovery tools
        if: steps.cache-go.outputs.cache-hit != 'true'
        env:
          GO111MODULE: on
        run: |
          go get -v github.com/projectdiscovery/naabu/v2/cmd/naabu
          go get -v github.com/projectdiscovery/notify/cmd/notify
#          go get -v github.com/projectdiscovery/cloudlist/cmd/cloudlist
        shell: bash

      - name: 🔎 SubFinder - DNS Enumeration
        uses: projectdiscovery/subfinder-action@main
        with:
          list: input/domains.txt
          output: output/passive_subdomains.txt
          config: config/subfinder-config.yaml

      - name: 💥 dnsx - DNS Resolver
        uses: projectdiscovery/dnsx-action@main
        with:
          list: output/passive_subdomains.txt
          output: output/active_subdomains.txt

      - name: Running naabu to check top 100 ports
        run: |
          naabu -iL output/active_subdomains.txt  -rate 10000 -top-ports 100 | tee output/active_ports.txt
        shell: bash

#      For running vulnerability assessment of cloud assets.
#      - name: Enumerating hosts from Cloud with Cloudlist
#        run: |
#          cloudlist -config config/cloudlist-config.yaml -ip | tee output/cloud_hosts.txt >> output/active_ports.txt
#        shell: bash

      - name: httpx - HTTP Web Server probing
        uses: projectdiscovery/httpx-action@main
        with:
          list: output/active_ports.txt
          output: output/active_urls.txt

      - name: Nuclei - DAST Scan
        uses: projectdiscovery/nuclei-action@main
        with:
          urls: output/active_urls.txt
          output: output/nuclei_output.txt

      - name: Notify Alerts
        run: |
          notify -slack -slack-webhook-url ${{ secrets.SLACK_WEBHOOK }} < output/nuclei_output.txt

      - name: Sorting the output results
        run: |
          find output -type f -exec sort {} -o {} \;
        shell: bash

      - name: Create local changes
        run: |
          git add output/passive_subdomains.txt
          git add output/active_subdomains.txt
          git add output/active_ports.txt
          git add output/active_urls.txt
          git add output/nuclei_output.txt
#          git add output/cloud_hosts.txt

      - name: Commit results to Github
        run: |
          git config --local user.email "sandeep@projectdiscovery.io"
          git config --global user.name "projectdiscovery"
          git commit -m "PD-Actions report" -a --allow-empty

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
